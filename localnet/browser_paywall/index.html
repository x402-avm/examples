<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Sea Survey Report — x402 Browser Paywall</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 24px;
      margin-top: 24px;
      background: #fafafa;
    }
    button {
      background: #0055ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    pre {
      background: #eee;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Deep Sea Hydrothermal Vent Survey</h1>

  <div class="card" id="paywall-card">

    <button id="unlock-btn">Unlock Report (0.004 ALGO)</button>
  </div>

  <div class="card" id="content-card" style="display: none;">

  </div>

  <script type="module">
    import { fetchPremiumContent } from './bundle.js';

    const btn = document.getElementById('unlock-btn');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Processing payment...';
      try {
        // In a real browser dApp, payerAddress and signTxns are provided by a wallet provider
        alert('In a full browser dApp, signTxns connects to Lute, Defly or Pera wallet.');
      } catch (err) {
        alert('Payment failed: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Unlock Report (0.004 ALGO)';
      }

</body>
</html>
